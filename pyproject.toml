[project]
name = "apographe"
version = "0.1.0"
description = "Collect public data, source by source and day by day, into plain files."
authors = [{ name = "Aristides Zenonos", email = "10169524+aristidesz@users.noreply.github.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["open-data", "data-collection", "web-scraping", "time-series", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["requests>=2.31", "defusedxml>=0.7"]

[project.optional-dependencies]
# The Cyprus fuel observatory needs a real browser to fill its form.
cy-fuel = [
    "selenium>=4.36",
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "chromedriver-autoinstaller>=0.6.4",
    "pyvirtualdisplay>=3.0",
    "pdfplumber>=0.11",
]

[project.scripts]
apographe = "apographe.cli:main"

[project.urls]
Homepage = "https://github.com/aristidesz/apographe"
Documentation = "https://github.com/aristidesz/apographe/tree/main/docs"
Changelog = "https://github.com/aristidesz/apographe/blob/main/CHANGELOG.md"
Issues = "https://github.com/aristidesz/apographe/issues"

[dependency-groups]
dev = [
    "mypy>=1.12",
    "bandit>=1.7.10",
    "pre-commit>=4.0.1",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.6",
    "pandas-stubs>=2.3.2.250926",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-requests>=2.32.4.20250913",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
# The notebooks are the original prototypes, kept as they were.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pycodestyle, pyflakes and import sorting: what flake8 and isort checked before.
select = ["E", "W", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true

[tool.hatch.build.targets.sdist]
# What goes in the source archive on PyPI: the package, its tests and docs.
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
