name: Run Python script daily

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install

      - name: Install Firefox and Geckodriver
        run: |
          sudo apt-get update
          # Install both firefox and geckodriver via apt so they are put in standard locations
          sudo apt-get install -y firefox geckodriver
          # sanity checks (optional, helpful for debugging in CI logs)
          which firefox || true
          firefox --version || true
          which geckodriver || true
          geckodriver --version || true

      - name: Run script
        run: |
          poetry run python main.py