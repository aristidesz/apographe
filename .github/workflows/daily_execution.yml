name: Run Python script daily

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the CSV to the data branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install
          pip install chromedriver-autoinstaller selenium pyvirtualdisplay

      - name: Install xvfb
        run: sudo apt-get install xvfb

      - name: Run script
        run: |
          poetry run python main.py

      # Commit to the data branch instead of uploading an artifact: artifacts
      # expire after 90 days and share the account's storage quota.
      - name: Save CSV to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data
          git worktree add ../data-branch FETCH_HEAD
          cp data/*.csv ../data-branch/
          cd ../data-branch
          git add *.csv
          git commit -m "Fuel prices $(date -u +%F_%H%M)"
          git push origin HEAD:data
